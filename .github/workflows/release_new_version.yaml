name: Release ShellCrash

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, for example 1.9.6'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev

      - name: Update version metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          printf '%s\n' "$RELEASE_VERSION" > version
          sed -i "s/^versionsh=.*/versionsh=$RELEASE_VERSION/" bin/version

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          assets_dir="$GITHUB_WORKSPACE/release-assets"
          rm -rf "$assets_dir"
          mkdir -p "$assets_dir"
          trap 'rm -rf "$package_dir"' EXIT

          cp -a scripts/. "$package_dir/"
          install -m 0644 \
            public/fake_ip_filter.list \
            public/servers.list \
            public/servers_chs.list \
            public/servers_en.list \
            public/task_chs.list \
            public/task_en.list \
            version \
            "$package_dir/"
          install -m 0644 rules/clash_providers/clash_providers.list "$package_dir/clash_providers.list"
          install -m 0644 rules/singbox_providers/singbox_providers.list "$package_dir/singbox_providers.list"
          curl --connect-timeout 10 --retry 3 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/ChanthMiao/China-IPv4-List/release/cn.txt \
            -o "$package_dir/cn_ip.txt"
          curl --connect-timeout 10 --retry 3 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/ChanthMiao/China-IPv6-List/release/cn6.txt \
            -o "$package_dir/cn_ipv6.txt"
          (
            cd "$package_dir"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
              --numeric-owner -I 'gzip -n' -cf "$GITHUB_WORKSPACE/ShellCrash.tar.gz" *
          )

          cp ShellCrash.tar.gz "$assets_dir/ShellCrash.tar.gz"
          cp version "$assets_dir/version"
          cp install.sh "$assets_dir/install.sh"
          cp install_en.sh "$assets_dir/install_en.sh"
          while IFS= read -r path; do
            relative=${path#./}
            asset_name="sc-${relative//\//-}"
            cp "$path" "$assets_dir/$asset_name"
          done < <(find bin public rules tools -type f ! -name 'ShellCrash.tar.gz' | sort)

          tar -tzf ShellCrash.tar.gz | grep -Fxq 'init.sh'
          tar -tzf ShellCrash.tar.gz | grep -Fxq 'menus/9_upgrade.sh'
          test -s "$assets_dir/ShellCrash.tar.gz"
          test -s "$assets_dir/install.sh"
          test -s "$assets_dir/install_en.sh"
          echo "ASSETS_DIR=$assets_dir" >> "$GITHUB_ENV"

      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add version bin/version
          git diff --cached --quiet || git commit -m "chore(release): v${RELEASE_VERSION}"
          git push origin HEAD:dev

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" "$ASSETS_DIR"/* \
            --target dev \
            --title "ShellCrash v${RELEASE_VERSION}" \
            --generate-notes
